          demand: 0.2
          wear: 1.0
    assessment_kind: independent_actor_probe
    assessment_note: Independent horse/rider fatigue profiles over scheduled 72-minute blocks. These actor tests
      DO NOT enforce shared position, transfer times, route distance, or successful courier delivery.
  ultramarathon:
    title: 24-hour ultramarathon
    description: An illustrative constant-work strategy, NOT an empirically fitted ultramarathon.
    actors:
