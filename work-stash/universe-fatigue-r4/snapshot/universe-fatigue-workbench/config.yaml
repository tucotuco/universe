  combat:
    title: Intermittent combat — five minutes
    description: Illustrative 1-second attack and 2-second guard patterns, not actual action energy calibration.
    actors:
      Fighter:
        profile: human
        fitness: 12
        repeat: 100
        segments:
        - name: Strenuous action
