    title: Combat D — Resolved grappling (two 3-minute bouts)
    description: Seeded opposed Touch, Grab, Grapple control and Escape checks from Encounters R60, two 180s bouts
      with 30s rest. Infeasible .70 grapples result in legal action changes, not ending the encounter. No damage,
      movement or positional takedowns.
    assessment_kind: grapple_encounter_subset
    assessment_note: This is an experimentally implemented subset of Encounters grappling, NOT the full combat resolver.
      Pre-established close range, no injury or movement, simple action-selection policy and no tactical timing
      allocation. Physical Grab and established Grapple are independent.
