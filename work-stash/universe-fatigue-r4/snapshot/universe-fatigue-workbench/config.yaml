          wear: 1.0
        - name: Guard / movement
          seconds: 2
          demand: 0.2
          wear: 1.0
    assessment_kind: combat_workload_probe
    assessment_note: A five-minute alternating workload test, not resolved Encounters actions. Attack outcomes,
      targets, injury, defense and simultaneous commitment are not simulated.
