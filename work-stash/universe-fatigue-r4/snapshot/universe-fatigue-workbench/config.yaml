  sprint_recovery:
    title: 10-second sprint and recovery
    description: Fitness 18, Run 20. Brief all-out effort, then two minutes at rest.
    actors:
      Sprinter:
        profile: human
        fitness: 18
        run_level: 20
        running: true
        segments:
        - name: Sprint
          seconds: 10
          demand: 1.0
          wear: 1.0
          all_out: true
        - name: Rest
          seconds: 120
          demand: 0.0
          wear: 1.0
    assessment_kind: max_effort_probe
    assessment_note: Ten-second voluntary maximum-output bout and recovery only. No distance is calculated; this
      is not a race completion test.
  legionary:
    title: Roman legionary — demanding loaded march
    description: 'Strict, non-negotiable duty: fixed pace/load proxy, camp work, and daily timetable. Failure to
      sustain any required block fails the assignment. Values remain illustrative. Higher-demand candidate.'
    actors:
      Legionary:
        profile: human
        fitness: 15
        run_level: 0
        running: false
        repeat: 4
        segments:
        - name: Loaded march
          seconds: 18000
          execution: fixed_pace
          reserve_floor: 0.25
          pacing_window_seconds: 600
          demand: 0.44
          wear: 1.1
          demand_basis: reference_fitness
        - name: Camp construction
          seconds: 7200
          execution: fixed_pace
          reserve_floor: 0.25
          pacing_window_seconds: 600
          demand: 0.5
          wear: 1.0
          demand_basis: reference_fitness
        - name: Light activity
          seconds: 32400
          demand: 0.1
          wear: 1.0
          demand_basis: reference_fitness
        - name: Sleep
          seconds: 28800
          demand: 0.0
          wear: 1.0
          sleep: true
        abilities:
          strength: 13
          dexterity: 12
          constitution: 16
          intelligence: 10
          wisdom: 11
          charisma: 10
    assessment_kind: fixed_duty
    assessment_note: Mandatory five-hour loaded march, two-hour camp-work block, and fixed daily rest schedule,
      repeated for four days. The given effort fractions are experimental, not load/speed-derived. No reduction
      in required pace or extra time is permitted. Planned daily stages must total exactly 24h; no delay or substitutions.
    hard_schedule: true
    daily_schedule_seconds: 86400
  pony_express:
    title: Pony Express — horse changes
    description: Illustrative two 72-minute stages; horse and rider states are independent.
    actors:
      Horse A:
        profile: equine_illustrative
        segments:
        - name: First relay stage
          seconds: 4320
          demand: 0.37
          wear: 1.0
        - name: Stable rest
          seconds: 4320
          demand: 0.0
          wear: 1.0
