schema_version: 1
engine_revision: R4
metadata:
  name: Universe Fatigue Workbench R4.7 — unified physical fatigue check modifier
  status: experimental
  note: Adds seeded Encounters R60 opposed Touch, Grab, Grapple, Escape, Break hold and fatigue-gated action choices.
    Retains all earlier reference scenarios.
profiles:
  mammal_reference:
    parent: null
    scaling: none
    parameters:
      critical_fresh: 0.6
      critical_floor: 0.25
      peak_floor: 0.55
      peak_curve: 2.0
      fast_budget: 20.0
      fast_recovery: 60.0
      slow_depletion: 7200.0
      slow_recovery_awake: 86400.0
      slow_recovery_sleep: 43200.0
      slow_baseline: 0.1
  human:
    parent: mammal_reference
    scaling: human_r4
    parameters: {}
    workload_scaling:
      reference_fitness: 12
      fitness_exponent: 1.0
  equine_illustrative:
    parent: mammal_reference
    scaling: none
    parameters:
      critical_fresh: 0.66
      fast_budget: 25.0
      slow_depletion: 14400.0
      slow_recovery_awake: 144000.0
    locomotion:
      reference_speed_kmh: 17.0
      reference_effort: 0.495
      speed_exponent: 1.8
      reference_fitness: 15
      fitness_exponent: 0.65
scenarios:
  equine_160km:
    title: Equine endurance — 160 km / six phases
    description: 'Distance-and-time objective: six 20–30 km riding phases, five mandatory holds and 15-hour deadline.
      Same route and schedule for horse and rider. Uses illustrative equine speed-to-effort calibration; no thermoregulation.'
    assessment_kind: equine_endurance_objective
    assessment_note: Distance, required pace, hold schedule, and deadline are assessed. Veterinary heart-rate recovery,
      soundness, other clinical checks, and official race completion are NOT modeled. This is a fatigue-feasibility
      test, not a veterinary clearance. All workload parameters are exploratory.
    objective:
      kind: equine_160km
      distance_km: 160
      deadline_hours: 15
      joint_actors:
      - Endurance horse
      - Rider
    actors:
      Endurance horse:
        profile: equine_illustrative
        fitness: 15
        abilities:
          constitution: 18
          strength: 16
          dexterity: 15
        segments:
