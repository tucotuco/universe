    assessment_note: Sensitivity control with lower hypothetical marching/camp demands, subject to the SAME strict
      duty schedule. Passing demonstrates only feasibility under these illustrative demands. Planned daily stages
      must total exactly 24h; no delay or substitutions.
    hard_schedule: true
    daily_schedule_seconds: 86400
  combat_a_weapon_duel:
    title: Combat A — Equal weapon programs, different Fitness
    description: Controlled longsword duels at 30s, 120s and 300s. Prescribed action timings and efforts identical,
      Fitness 12 versus Fitness 16; no wounds or outcome dice.
    assessment_kind: combat_action_fatigue_calibration
    assessment_note: Only action preparation and fatigue are tested. Longsword timing 6s, Parry timing 5s, Dodge
      2s (Encounters R60). Strikes do not damage; no attack/defense checks.
    actors:
      Fitness 12 swordsman:
        profile: human
        fitness: 12
        run_level: 0
        abilities:
          constitution: 14
          strength: 12
          dexterity: 12
      Fitness 16 swordsman:
